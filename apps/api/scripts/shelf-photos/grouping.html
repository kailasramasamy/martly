<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group photos</title>
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --primary: #0f766e; --primary-soft: #ccfbf1; --warn: #b45309; --warn-soft: #fef3c7; --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 17px; }
  .stats { color: var(--muted); }
  .spacer { flex: 1; }
  .saved { color: var(--muted); min-width: 64px; text-align: right; }
  .saved.err { color: var(--danger); }
  label.filter { display: flex; gap: 6px; align-items: center; cursor: pointer; min-height: 32px; }
  main { padding: 16px; display: grid; gap: 12px; }
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .group.unsure { border-color: #f59e0b; }
  .group.skip { opacity: .5; }
  .group.checked { border-color: var(--primary); }
  .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .title { font-weight: 600; font-size: 15px; }
  .sub { color: var(--muted); }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; background: var(--warn-soft); color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  figure { position: relative; margin: 0; width: 170px; }
  figure img { display: block; width: 100%; height: 226px; object-fit: contain; background: #f1f5f9; border-radius: 8px; border: 2px solid transparent; cursor: zoom-in; }
  figure.main img { border-color: var(--primary); }
  figcaption { display: flex; justify-content: space-between; gap: 4px; padding-top: 4px; font-size: 12px; color: var(--muted); }
  button { font: inherit; min-height: 32px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--primary); color: var(--primary); }
  button.ok { background: var(--primary); border-color: var(--primary); color: #fff; }
  .mainBtn { min-height: 26px; padding: 0 8px; font-size: 12px; }
  figure.main .mainBtn { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .split { align-self: center; min-height: 44px; padding: 4px 8px; font-size: 12px; writing-mode: vertical-rl; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(15, 23, 42, .85); }
  dialog img { display: block; max-width: 96vw; max-height: 96vh; }
  @media (max-width: 480px) { figure { width: 44%; } figure img { height: 180px; } }
</style>
</head>
<body>
<header>
  <h1>Group photos</h1>
  <span class="stats" id="stats"></span>
  <label class="filter"><input type="checkbox" id="onlyOpen"> Hide checked</label>
  <label class="filter"><input type="checkbox" id="onlyUnsure"> Only unsure</label>
  <span class="spacer"></span>
  <span class="saved" id="saved"></span>
</header>
<main id="list"></main>
<dialog id="zoom"><img alt="Full size photo"></dialog>
<script>
let groups = [], reads = {}, saveTimer;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const photoUrl = (f) => `/photo/${encodeURIComponent(f.replace(/\.(heic|jpe?g)$/i, ".jpg"))}`;
const shortName = (f) => f.replace(/^(IMG|BP|BA)_|\.(heic|jpe?g)$/gi, "");

function bestMain(photos) {
  return photos.find((f) => reads[f]?.role === "front") ?? photos[0];
}

function refresh(group) {
  group.id = group.photos[0].replace(/\.(heic|jpe?g)$/i, "");
  if (!group.photos.includes(group.main)) group.main = bestMain(group.photos);
}

function title(group) {
  const read = reads[group.main] ?? {};
  const name = [read.brand, read.product].filter(Boolean).join(" ") || "Name not read";
  return { name, size: read.size ?? "" };
}

function figure(group, file) {
  const read = reads[file] ?? {};
  return `<figure class="${file === group.main ? "main" : ""}">
    <img loading="lazy" src="${photoUrl(file)}" alt="${esc(read.look)}" data-zoom="${esc(file)}">
    <figcaption><span>${esc(shortName(file))} · ${esc(read.isProduct === false ? "no product" : read.role)}</span>
    <button class="mainBtn" data-act="main" data-group="${esc(group.id)}" data-file="${esc(file)}">Main</button></figcaption>
  </figure>`;
}

function card(group, index) {
  const { name, size } = title(group);
  const unsure = group.confidence !== "high" && !group.checked;
  const parts = group.photos.map((file, i) => (i ? `<button class="split" data-act="split" data-group="${esc(group.id)}" data-at="${i}" title="Start a new product here">Split</button>` : "") + figure(group, file));
  return `<section class="group ${unsure ? "unsure" : ""} ${group.skip ? "skip" : ""} ${group.checked ? "checked" : ""}">
    <div class="head"><span class="title">${esc(name)}</span><span class="sub">${esc(size)} · ${group.photos.length} photo${group.photos.length === 1 ? "" : "s"}</span>
    ${unsure ? `<span class="tag">Unsure${group.note ? `: ${esc(group.note)}` : ""}</span>` : ""}</div>
    <div class="row">${parts.join("")}</div>
    <div class="actions">
      <button class="${group.checked ? "" : "ok"}" data-act="check" data-group="${esc(group.id)}">${group.checked ? "Checked ✓" : "Looks right"}</button>
      ${index < groups.length - 1 ? `<button data-act="merge" data-group="${esc(group.id)}">Merge with next product</button>` : ""}
      <button data-act="skip" data-group="${esc(group.id)}">${group.skip ? "Include it" : "Skip, not a product"}</button>
    </div>
  </section>`;
}

function render() {
  const hideChecked = $("onlyOpen").checked, onlyUnsure = $("onlyUnsure").checked;
  const shown = groups.map((g, i) => [g, i]).filter(([g]) => (!hideChecked || !g.checked) && (!onlyUnsure || g.confidence !== "high"));
  $("list").innerHTML = shown.map(([g, i]) => card(g, i)).join("");
  const unsure = groups.filter((g) => g.confidence !== "high" && !g.checked).length;
  const checked = groups.filter((g) => g.checked).length;
  $("stats").textContent = `${groups.length} products · ${checked} checked · ${unsure} unsure · ${groups.filter((g) => g.skip).length} skipped`;
}

function save() {
  $("saved").textContent = "Saving…";
  $("saved").className = "saved";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const res = await fetch("/api/groups", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(groups) });
    const ok = res.ok;
    $("saved").textContent = ok ? "Saved" : `Not saved: ${(await res.json()).error}`;
    $("saved").className = ok ? "saved" : "saved err";
  }, 300);
}

const actions = {
  main(group, data) { group.main = data.file; },
  check(group) { group.checked = !group.checked; },
  skip(group) { group.skip = !group.skip; },
  split(group, data) {
    const at = Number(data.at);
    const rest = { photos: group.photos.slice(at), confidence: "high", note: "", main: "" };
    group.photos = group.photos.slice(0, at);
    refresh(group);
    refresh(rest);
    groups.splice(groups.indexOf(group) + 1, 0, rest);
  },
  merge(group) {
    const next = groups[groups.indexOf(group) + 1];
    group.photos.push(...next.photos);
    group.confidence = "high";
    group.note = "";
    groups.splice(groups.indexOf(next), 1);
    refresh(group);
  },
};

document.addEventListener("click", (event) => {
  const zoom = event.target.closest("[data-zoom]");
  if (zoom) {
    $("zoom").querySelector("img").src = zoom.src;
    return $("zoom").showModal();
  }
  if (event.target.closest("dialog")) return $("zoom").close();
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const group = groups.find((g) => g.id === button.dataset.group);
  actions[button.dataset.act](group, button.dataset);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  save();
});
$("onlyOpen").addEventListener("change", render);
$("onlyUnsure").addEventListener("change", render);

fetch("/api/groups").then((r) => r.json()).then((data) => {
  groups = data.groups;
  reads = data.reads;
  render();
});
</script>
</body>
</html>
