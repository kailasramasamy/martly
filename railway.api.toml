# Railway config for the "api" service only (service Settings → Config-as-code → /railway.api.toml).
# railway.toml is shared by admin and web, which don't serve /health/ready, so the healthcheck can't live there.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# A new deploy takes traffic only once the database answers; migrations run before the server starts, hence the long timeout
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
# Time between SIGTERM and SIGKILL; the server exits by itself within 15s of SIGTERM
drainingSeconds = 20
