# Railway: project "martly" — PostgreSQL plus three services built from this repo.
#
# Service "api"   — Dockerfile (default). Migrations run on every start.
#   DATABASE_URL          ${{Postgres.DATABASE_URL}}
#   JWT_SECRET            long random string
#   CORS_ORIGIN           https://<admin service domain>
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET, S3_KEY_PREFIX, MEDIA_PUBLIC_BASE_URL
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET          (test keys until go-live)
#   FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY
#   OPENAI_API_KEY / ANTHROPIC_API_KEY            (AI ordering)
#   GOOGLE_MAPS_API_KEY                           (address geocoding)
#
# Service "admin" — RAILWAY_DOCKERFILE_PATH=Dockerfile.admin
#   VITE_API_URL          https://<api service domain>   (baked in at build time)
#
# Service "web"   — martlyshop.in, RAILWAY_DOCKERFILE_PATH=Dockerfile.web
#   MARTLY_API_URL        http://api.railway.internal:<api PORT>/api/v1   (private network; the site calls the API server-side)
#   WEB_API_SECRET        same value as on "api", so the site's search logs count

#
# Railway retired Config as Code: this file stops being read on 2026-12-01. Set the restart policy below in each
# service's Settings before then. The api's healthcheck (/health/ready) and RAILWAY_DEPLOYMENT_DRAINING_SECONDS=20
# already live in its service settings.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
